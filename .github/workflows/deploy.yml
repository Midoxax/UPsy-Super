name: Deploy (Cloudflare Workers)

# Independent hosting path from Phase 0 of docs/runbooks/00-exit-and-ownership.md.
# The build target is already Cloudflare (nitro `cloudflare-module` preset), so
# this workflow is the whole hosting story: GitHub is the source of truth,
# Cloudflare serves upsy.ma, and Lovable becomes one optional editor.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY / VITE_SUPABASE_PROJECT_ID
#   VITE_SITE_URL          — canonical origin, e.g. https://www.upsy.ma
#   SUPABASE_ACCESS_TOKEN  — personal access token, dashboard.supabase.com/account/tokens
#   SUPABASE_DB_PASSWORD   — the linked project's Postgres password
# Optional: VITE_SENTRY_DSN, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST, GTM_ID,
#           VITE_GOOGLE_MAPS_API_KEY
#
# Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, …) are set on
# the Worker itself with `wrangler secret put`, never in this file.
#
# Migrations run in the `migrate-database` job below, before the build/deploy
# job, closing DEPLOYMENT.md's "migrations are not applied by the pipeline"
# gap — a merge to main used to land a migration file in git with nothing
# ever pushing it to the database. `supabase/config.toml`'s project_id is the
# single source of truth for which project gets linked; SUPABASE_ACCESS_TOKEN
# authenticates the CLI against the Supabase management API, SUPABASE_DB_PASSWORD
# authenticates the direct Postgres connection `db push` needs — two different
# credentials for two different connections, so wrangler-style "one secret,
# many meanings" mistakes cannot recur here.
#
# Installs with bun: bun.lock is the committed lockfile and there is no
# package-lock.json, so `npm ci` has nothing to install from.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options: [production, preview]
        default: preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-database:
    name: Apply pending Supabase migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    # Preview versions upload does not go live, so there is nothing for a
    # preview run to migrate against — only a production deploy applies schema.
    if: ${{ github.event.inputs.environment != 'preview' }}
    steps:
      - uses: actions/checkout@v5

      - name: Required secrets present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions. SUPABASE_ACCESS_TOKEN comes from https://supabase.com/dashboard/account/tokens; SUPABASE_DB_PASSWORD is the linked project's database password (Project Settings > Database)."
            exit 1
          fi
          echo "Both Supabase migration secrets are set."

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_ref=$(grep -oE '^project_id = "[a-z0-9]+"' supabase/config.toml | cut -d'"' -f2)
          if [ -z "$project_ref" ]; then
            echo "::error::Could not read project_id from supabase/config.toml"
            exit 1
          fi
          echo "Linking to Supabase project $project_ref"
          npx --yes supabase@latest link --project-ref "$project_ref"
          npx --yes supabase@latest db push --yes

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: migrate-database
    # migrate-database skips itself (not fails) on a preview run — the default
    # implicit `if: success()` would otherwise skip this job too. Only an
    # actual migration failure should block the deploy.
    if: ${{ !failure() && !cancelled() }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # bun.lock is this repository's lockfile. setup-node@v5 turns its
          # package-manager cache on by default, and that cache only knows
          # package-lock.json / npm-shrinkwrap.json / yarn.lock, so it aborts
          # the job before install. Bun is cached by oven-sh/setup-bun below.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Fails before any Cloudflare call if the env contract or routing config
      # drifted — a bad deploy is far more expensive than a failed job.
      - name: Deploy config gate
        run: node scripts/check-deploy-config.mjs

      # Names the missing secret instead of letting wrangler fail eight minutes
      # later with an opaque authentication error, or — worse — letting the
      # build succeed with an empty Supabase URL baked into the client bundle.
      - name: Required secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SITE_URL; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required deploy secrets are set."

      # wrangler reports a revoked token, a wrong account id and a missing Workers
      # permission with one identical "Authentication error [code: 10000]", and only
      # after the build. This asks the three questions separately, up front, and
      # names the one that failed.
      - name: Cloudflare preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-access.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # Opt-in only — see src/config/auth.ts. Blank/unset keeps the social
          # buttons hidden, which is the safe default until a provider has been
          # configured in Supabase Auth and proven with a real sign-in.
          VITE_OAUTH_PROVIDERS: ${{ secrets.VITE_OAUTH_PROVIDERS }}
          VITE_APP_VERSION: ${{ github.sha }}
          # GTM container ID (e.g. GTM-XXXXXXX) — substituted into the built
          # output by scripts/inject-gtm-id.mjs, chained onto `build`. Unset
          # keeps the GTM snippet inert (see src/lib/analytics/gtm.ts).
          GTM_ID: ${{ secrets.GTM_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: bun run build

      - name: Verify production output
        run: node scripts/verify-build.mjs

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            bunx wrangler versions upload --config "$(node scripts/build-output.mjs --wrangler)" 2>&1 | tee deploy-output.txt
          else
            bunx wrangler deploy --config "$(node scripts/build-output.mjs --wrangler)" 2>&1 | tee deploy-output.txt
          fi
          # The smoke test must hit what this job just published. VITE_SITE_URL is
          # the canonical domain, which stays pointed at the previous host until DNS
          # is cut over — smoke-testing it would grade the old site and report a
          # green deploy that never served a request.
          url=$(grep -oE 'https://[a-z0-9._-]+\.workers\.dev' deploy-output.txt | head -1)
          echo "deployed_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed worker URL: ${url:-<not detected>}"

      # A deploy that returns 200 on "/" but 500 on an SSR route is the failure
      # mode this catches; the workflow should go red, not the users' browsers.
      - name: Smoke test the deployment just published
        if: ${{ github.event.inputs.environment != 'preview' }}
        env:
          # Prefer the worker URL this run produced; fall back to the canonical
          # domain only once DNS actually points at Cloudflare.
          PROD_URL: ${{ steps.deploy.outputs.deployed_url || secrets.VITE_SITE_URL }}
        run: node scripts/check-production.mjs
