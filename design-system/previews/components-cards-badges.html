<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>U.Psy — Cards & Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --background: 36 41% 95%; --foreground: 0 0% 10%;
    --primary: 45 96% 48%; --primary-foreground: 0 0% 10%;
    --secondary: 350 76% 24%; --secondary-foreground: 36 41% 97%;
    --destructive: 0 84% 60%; --destructive-foreground: 0 0% 100%;
    --muted-foreground: 0 0% 32%;
  }
  body {
    margin: 0; padding: 32px;
    background:
      radial-gradient(50% 50% at 10% 15%, rgba(109,15,34,0.06), transparent 60%),
      radial-gradient(45% 45% at 95% 90%, rgba(242,183,5,0.10), transparent 60%),
      hsl(var(--background));
    color: hsl(var(--foreground)); font-family: 'Manrope', sans-serif;
  }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: hsl(var(--muted-foreground)); margin: 32px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }

  .glass-card {
    background: rgba(255,255,255,0.40);
    border: 1px solid rgba(255,255,255,0.60);
    border-radius: 20px;
    box-shadow: 0 32px 64px -16px rgba(61,6,17,0.08);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    padding: 28px;
    width: 280px;
    transition: transform 300ms cubic-bezier(0.25,0.1,0.25,1), box-shadow 500ms cubic-bezier(0.25,0.1,0.25,1);
  }
  .glass-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 40px 80px -20px rgba(61,6,17,0.14), 0 0 0 1px rgba(242,183,5,0.25);
  }
  .card-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .card-desc { font-size: 14px; color: hsl(var(--muted-foreground)); margin: 0 0 16px; }

  .badge {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 10px 4px;
    font-size: 12px; font-weight: 600; border: 1px solid transparent;
  }
  .badge-default { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .badge-secondary { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); }
  .badge-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
  .badge-outline { background: transparent; border-color: hsl(var(--muted-foreground) / 0.4); color: hsl(var(--foreground)); }
</style>
</head>
<body>
  <h2>Glass Card</h2>
  <div class="row">
    <div class="glass-card">
      <span class="badge badge-secondary" style="margin-bottom:12px">Accredited</span>
      <h3 class="card-title">Dr. Amina Bennani</h3>
      <p class="card-desc">Clinical psychologist · CBT · Video sessions worldwide</p>
    </div>
    <div class="glass-card">
      <span class="badge badge-default" style="margin-bottom:12px">Free rebook</span>
      <h3 class="card-title">Session matching</h3>
      <p class="card-desc">Find the right fit in one 2-minute check-in.</p>
    </div>
  </div>

  <h2>Badges</h2>
  <div class="row">
    <span class="badge badge-default">Default</span>
    <span class="badge badge-secondary">Secondary</span>
    <span class="badge badge-destructive">Destructive</span>
    <span class="badge badge-outline">Outline</span>
  </div>
</body>
</html>
