<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>U.Psy — Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: 36 41% 95%; --foreground: 0 0% 10%;
    --primary: 45 96% 48%; --primary-foreground: 0 0% 10%;
    --gold-accent: 42 100% 50%; --gold-highlight: 39 100% 48%;
    --destructive: 0 84% 60%; --destructive-foreground: 0 0% 100%;
    --muted: 36 25% 92%; --muted-foreground: 0 0% 32%;
    --border: 36 20% 86%; --input: 36 20% 92%;
  }
  body { margin: 0; padding: 32px; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: 'Manrope', sans-serif; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: hsl(var(--muted-foreground)); margin: 32px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  button { font-family: inherit; border: none; cursor: pointer; transition: all 300ms cubic-bezier(0.25,0.1,0.25,1); }
  button:active { transform: scale(0.97); }

  .btn-primary {
    font-size: 16px; font-weight: 500; padding: 14px 22px; min-height: 48px;
    border-radius: 14px; color: #1A1A1A;
    background: linear-gradient(135deg, #FFB300, #F4A300);
  }
  .btn-primary:hover { opacity: 0.9; box-shadow: 0 20px 40px -10px rgba(242,183,5,0.40); filter: brightness(1.1); }

  .btn-secondary {
    font-size: 16px; font-weight: 500; padding: 14px 22px; min-height: 48px;
    border-radius: 14px; background: transparent; color: hsl(var(--gold-accent));
    border: 1px solid hsl(var(--gold-accent));
  }
  .btn-secondary:hover { background: hsl(var(--gold-accent) / 0.1); box-shadow: 0 0 20px rgba(255,179,0,0.15); }

  .btn-tertiary {
    color: #fff; background: transparent; border: none; padding: 0; font-weight: 500;
  }
  .btn-tertiary:hover { color: hsl(var(--gold-accent)); }
  .dark-bg { background: #1A1A1A; padding: 20px; border-radius: 14px; display: inline-flex; }

  .btn-default { border-radius: 8px; height: 40px; padding: 0 16px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-size: 14px; }
  .btn-default:hover { background: hsl(var(--primary) / 0.9); }
  .btn-destructive { border-radius: 8px; height: 40px; padding: 0 16px; background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); font-size: 14px; }
  .btn-outline { border-radius: 8px; height: 40px; padding: 0 16px; background: hsl(var(--background)); border: 1px solid hsl(var(--input)); font-size: 14px; }
  .btn-ghost { border-radius: 8px; height: 40px; padding: 0 16px; background: transparent; font-size: 14px; }
</style>
</head>
<body>
  <h2>Brand Variants (U.Psy Liquid-Glass)</h2>
  <div class="row">
    <button class="btn-primary">Primary CTA</button>
    <button class="btn-secondary">Secondary</button>
    <div class="dark-bg"><button class="btn-tertiary">Tertiary link →</button></div>
  </div>

  <h2>Standard Variants (shadcn base)</h2>
  <div class="row">
    <button class="btn-default">Default</button>
    <button class="btn-destructive">Destructive</button>
    <button class="btn-outline">Outline</button>
    <button class="btn-ghost">Ghost</button>
  </div>
</body>
</html>
